[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # These VITE_* values are public client-side config (Firebase web config and
  # the Supabase publishable key). Vite inlines them into the browser bundle by
  # design, so they are excluded from secrets scanning.
  SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_APP_ID,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_SUPABASE_PUBLISHABLE_KEY,VITE_SUPABASE_URL"
